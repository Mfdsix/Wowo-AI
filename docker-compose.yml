services:
  wowo:
    build: .
    image: wowo-ai:latest
    container_name: wowo-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override: DB harus absolute path ke volume di dalam container
      DATABASE_URL: "file:/app/data/dev.db"
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # Persist SQLite biar data gak hilang pas container restart
      - wowo-data:/app/data
    # OCR service jalan di host? ganti OCR_BASE_URL jadi http://host.docker.internal:8000
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  wowo-data: